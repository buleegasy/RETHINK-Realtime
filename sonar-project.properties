# SonarCloud Configuration for RETHINK-Realtime
sonar.projectKey=buleegasy_RETHINK-Realtime
sonar.organization=buleegasy

# Define source and test directories
sonar.sources=web/src,worker/src
sonar.tests=web/test,worker/test

# Exclude generated code, migrations, and edge proxy scripts from analysis
sonar.exclusions=functions/**,dist/**,node_modules/**,worker/migrations/**

# Exclude test files, migrations, and fallback proxies from duplicate code detection (CPD)
sonar.cpd.exclusions=web/test/**,worker/test/**,functions/**,worker/migrations/**
