<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849.054 440.45" width="849.054" height="440.45" style="--bg:#1F1F1F;--fg:#CCCCCC;--line:#CCCCCC;--accent:#0078D4;--muted:#CCCCCCCC;--surface:#181818;--border:#CCCCCC;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="par" data-label="文本转写与异步思考">
  <rect x="140" y="195.45" width="679.054" height="180" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="140" y="195.45" width="163.51000000000002" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="146" y="204.45" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">par [文本转写与异步思考]</text>
</g>
<line class="lifeline" data-actor="User" x1="70" y1="92.45" x2="70" y2="410.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="RT" x1="252.19" y1="70" x2="252.19" y2="410.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Worker" x1="465.8185" y1="70" x2="465.8185" y2="410.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DeepSeek" x1="693.1555" y1="70" x2="693.1555" y2="410.45" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="User" data-to="RT" data-label="说话完毕（停顿 600ms）" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="70" y1="112.45" x2="252.19" y2="112.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="161.095" y="102.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">说话完毕（停顿 600ms）</text>
</g>
<g class="message" data-from="RT" data-to="User" data-label="🔊 开始播报（长篇大论、套话客套）" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="252.19" y1="167.45" x2="70" y2="167.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="161.095" y="157.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">🔊 开始播报（长篇大论、套话客套）</text>
</g>
<g class="message" data-from="RT" data-to="Worker" data-label="异步推送转写文本" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="252.19" y1="235.45" x2="465.8185" y2="235.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="359.00424999999996" y="225.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">异步推送转写文本</text>
</g>
<g class="message" data-from="Worker" data-to="DeepSeek" data-label="调用异步思考 (耗时约 800ms~1.2s)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="465.8185" y1="275.45" x2="693.1555" y2="275.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="579.487" y="265.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">调用异步思考 (耗时约 800ms~1.2s)</text>
</g>
<g class="message" data-from="DeepSeek" data-to="Worker" data-label="返回精炼 CBT 指导（如“你应该引导其评估最坏情况”）" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="693.1555" y1="315.45" x2="465.8185" y2="315.45" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="579.487" y="305.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">返回精炼 CBT 指导（如“你应该引导其评估最坏情况”）</text>
</g>
<g class="message" data-from="Worker" data-to="RT" data-label="写入对话上下文 (conversation.item.create)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="465.8185" y1="355.45" x2="252.19" y2="355.45" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="359.00424999999996" y="345.45" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">写入对话上下文 (conversation.item.create)</text>
</g>
<g class="note" data-position="over" data-actors="RT">
  <polygon points="108.685,120.45 389.695,120.45 395.695,126.45 395.695,143.45 108.685,143.45" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="389.695,120.45 395.695,126.45 389.695,126.45" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.19" y="131.95" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Server VAD 触发，立即自动开始生成并播报语音！</text>
</g>
<g class="note" data-position="over" data-actors="RT">
  <polygon points="108.685,363.45 389.695,363.45 395.695,369.45 395.695,386.45 108.685,386.45" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="389.695,363.45 395.695,369.45 389.695,369.45" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="252.19" y="374.95" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">此时语音早就播完了！指令只能留给【下一轮】！</text>
</g>
<g class="actor" data-id="User" data-label="学生" data-type="actor">
  <g transform="translate(52,32) scale(1.5)">
    <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M15 10C15 11.6569 13.6569 13 12 13C10.3431 13 9 11.6569 9 10C9 8.34315 10.3431 7 12 7C13.6569 7 15 8.34315 15 10Z" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
    <path d="M5.62842 18.3563C7.08963 17.0398 9.39997 16 12 16C14.6 16 16.9104 17.0398 18.3716 18.3563" fill="none" stroke="var(--_line)" stroke-width="0.6666666666666666" />
  </g>
  <text x="70" y="84" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">学生</text>
</g>
<g class="actor" data-id="RT" data-label="MiniMax Realtime (语音模型)" data-type="participant">
